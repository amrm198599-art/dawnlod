name: Build Waleed Video Downloader Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (uses the *OnDevice*.zip if you uploaded it)
        run: |
          ZIP=$(find . -maxdepth 2 -name '*OnDevice*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            rm -rf _unzipped && unzip -oq "$ZIP" -d _unzipped
            SEARCH=_unzipped
          else
            SEARCH=.
          fi
          CFG=$(find "$SEARCH" -maxdepth 4 -not -path '*/node_modules/*' \( -name capacitor.config.json -o -name capacitor.config.ts \) | head -n 1)
          [ -n "$CFG" ] || { echo "::error::capacitor.config.* not found"; exit 1; }
          DIR=$(cd "$(dirname "$CFG")" && pwd)
          [ -f "$DIR/scripts/configure-android.js" ] || { echo "::error::scripts/configure-android.js missing. Upload the OnDevice zip or the full project."; exit 1; }
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --prefix client

      - name: Build web assets
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          CI: 'false'
        run: npm run build

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a debug APK only."

      - name: Configure Android (on-device yt-dlp, Kotlin, signing)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$VERSION_CODE" >> "$GITHUB_ENV"
          node scripts/configure-android.js

      - name: Build signed release (APK + AAB)
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: env.HAS_SIGNING != 'true'
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify download engine is inside the APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -q 'libpython.zip.so' || { echo "::error::python engine (libpython) missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q 'libffmpeg.zip.so' || { echo "::error::ffmpeg missing from APK"; exit 1; }
          mkdir -p /tmp/apkchk && unzip -oq "$APK" 'classes*.dex' -d /tmp/apkchk
          cat /tmp/apkchk/classes*.dex | strings | grep -q 'YtDlpPlugin' || { echo "::error::YtDlpPlugin class missing from APK"; exit 1; }
          echo "OK: engine + plugin are packaged."

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: Waleed-Video-Downloader-Android
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
