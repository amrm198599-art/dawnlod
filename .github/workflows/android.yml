name: Build Waleed Video Downloader Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          if [ ! -f package.json ] && ! find . -maxdepth 3 -name capacitor.config.* | grep -q .; then
            for z in $(find . -maxdepth 2 -name '*.zip'); do unzip -oq "$z" -d _unzipped; done
          fi
          CFG=$(find . -maxdepth 4 -not -path '*/node_modules/*' \( -name capacitor.config.json -o -name capacitor.config.ts \) | head -n 1)
          [ -n "$CFG" ] || { echo "::error::capacitor.config.* not found"; exit 1; }
          DIR=$(cd "$(dirname "$CFG")" && pwd)
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund typescript
          if [ -d client ]; then npm install --no-audit --no-fund --prefix client; fi

      - name: Build web assets
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          CI: 'false'
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::API_BASE_URL variable not set. Using a placeholder; downloads will not work until you set it."
            API_BASE_URL="https://example.com"
          fi
          REACT_APP_API_URL="$API_BASE_URL" npm run build

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Add signing + version to Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cat > android/app/signing.gradle <<'GRADLE'
          android {
              defaultConfig {
                  versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
                  versionName(System.getenv("VERSION_NAME") ?: "1.0")
              }
              def ksPath = System.getenv("KEYSTORE_PATH")
              if (ksPath) {
                  signingConfigs {
                      release {
                          storeFile file(ksPath)
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
                  buildTypes { release { signingConfig signingConfigs.release } }
              }
          }
          GRADLE
          printf "\napply from: 'signing.gradle'\n" >> android/app/build.gradle
          printf "\norg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8\n" >> android/gradle.properties
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building debug APK only."
          fi

      - name: Build signed release (APK + AAB)
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: env.HAS_SIGNING != 'true'
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: Waleed-Video-Downloader-Android
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
